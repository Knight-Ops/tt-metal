[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ttrunner-qwen36"
version = "0.1.0"
description = "tt-kernel dispatch runner for Qwen3.6-35B-A3B on Tenstorrent Blackhole (tt-nn)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10,<3.13"
# INFORMATIONAL ONLY: tt-kernel installs this wheel with `pip install --no-deps`, so these are
# not resolved at install time. They document the serving-env expectations. `ttnn` and `ttl`
# (tt-lang) are deliberately ABSENT — they are the platform, present in the serving venv and
# co-versioned with the kernel cache, never vendored or depended upon.
dependencies = [
    "torch",
    "transformers==4.53.0",
    "safetensors",
    "loguru",
]

# Optional auto-discovery by the dispatch serving layer. The explicit `--runner-spec` at push
# time always works regardless of this entry point.
[project.entry-points."tt_models.runners"]
qwen3_6_a3b = "ttrunner_qwen36.runner:Qwen36Runner"

[tool.setuptools.packages.find]
include = ["ttrunner_qwen36*"]
